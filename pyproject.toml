[project]
name = "forge"
version = "0.1.0"
description = "Candidate strategy generator for the Forge → Crucible → QuantIQ pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "aj", email = "akidnamedaj@gmail.com" }]
dependencies = [
    "crucible_contracts",
    "pydantic>=2.7,<3",
    "polars>=1.10,<2",
    "duckdb>=1.0,<2",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pre-commit>=3.7",
]

[project.scripts]
forge = "forge.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.uv.sources]
crucible_contracts = { path = "../crucible_contracts", editable = true }

# ---------------------------------------------------------------------------
# Ruff (strict)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle + pyflakes
    "I",                  # isort
    "B",                  # flake8-bugbear
    "UP",                 # pyupgrade
    "RUF",                # ruff-specific
    "SIM",                # flake8-simplify
    "PL",                 # pylint
    "TID",                # tidy imports
    "ANN",                # annotations
    "PT",                 # pytest style
    "DTZ",                # datetime usage
    "S",                  # bandit-lite security
]
ignore = [
    "PLR0913",  # too many arguments — Pydantic models can need many
    "PLR2004",  # magic value comparisons
    "ANN401",   # Any is sometimes the honest type
    "S101",     # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101", "S311", "PT011", "PLC0415", "S603", "S607"]
"src/forge/cli/**" = ["B008", "UP007", "PLC0415"]  # Typer + lazy imports for fast --help / mismatch resilience
"src/forge/core/seed.py" = ["S311"]                # Deterministic non-crypto RNG is the whole point
"scripts/**" = ["S603", "S607", "T201", "PLR0911", "PLC0415"]  # Pre-commit hook scripts shell out + branchy validation + lazy imports (sys.path inserts)

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy (strict)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
markers = [
    "unit: pure-logic single-module tests",
    "integration: multi-module workflows",
    "invariants: structural mitigations",
    "slow: tests that take > 5 seconds",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src/forge"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
