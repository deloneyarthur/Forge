# Forge pre-commit hooks. Phase 0 ships ruff + mypy + standard hygiene.
# Phase 1 will add the grammar version-bump scanner (hard rule #10).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - "pydantic>=2.7"
          - "types-pyyaml>=6.0"
          - "structlog>=24.0"
          - "typer>=0.12"
        files: ^src/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: check-merge-conflict
