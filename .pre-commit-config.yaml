# Forge pre-commit hooks.
# - Phase 0: ruff + mypy + standard hygiene.
# - Phase 1: grammar version-bump scanner (CLAUDE.md hard rule #10) and
#   grammar↔doc sync (GRAMMAR.md must have a section per rule id).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs in the local venv (language: system) rather than pre-commit's
  # isolated env because `crucible_contracts` is a sibling path dep that's
  # not on PyPI — pre-commit's isolated env can't install it. The local
  # uv-managed venv has it; CI must run mypy via `uv run` for the same
  # reason.
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (local venv)
        entry: uv run mypy --strict src
        language: system
        types: [python]
        files: ^src/
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=200]
        # The cap catches accidental binaries/data; deliberate text archives are
        # exempt (ledger rotations move ~800KB slices into _archive/, D242).
        exclude: ^_archive/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: grammar-version-bump
        name: grammar version-bump scanner
        description: |
          Refuse commits that change config/grammar.yaml without bumping
          grammar_version and staging the prior version under
          config/grammar_archive/. CLAUDE.md hard rule #10.
        # `uv run python`, not bare `python` (2026-08-02, D351): there is no `python` on this
        # box's PATH — only `python3` and the uv-managed interpreter — so this hook could never
        # execute and died "Executable `python` not found" on the FIRST grammar bump that tried
        # to run it. A hard-rule-#10 guard that cannot run is worse than no guard: it reads as
        # enforcement in the config and blocks the commit at the moment you most want a real
        # answer. Same fix the mypy hook above already carries, and for the same reason.
        entry: uv run python scripts/check_grammar_version_bump.py
        language: system
        pass_filenames: false
        files: ^(config/grammar\.yaml|config/grammar_archive/.*\.yaml)$
        always_run: false
      - id: freeze-governance
        name: signed-freeze governance guard
        description: |
          Once docs/proposals/grammar-freeze-declaration.md reads SIGNED, refuse a
          content change to config/grammar.yaml unless an OPEN preregistration with a
          stated required n exists (declaration §6 sequencing), or a §5 reopener is
          exercised via FORGE_FREEZE_REOPENER=D### with that Decision Log entry staged
          in the same commit. D390 signed the freeze and recorded that nothing enforced
          it; D391/D389 is the same class — arm it or delete the claim.
        entry: uv run python scripts/check_freeze_governance.py   # see the note above
        language: system
        pass_filenames: false
        files: ^config/grammar\.yaml$
        always_run: false
      - id: grammar-doc-sync
        name: grammar ↔ GRAMMAR.md sync
        description: |
          Every rule id in config/grammar.yaml must have a matching heading
          in docs/GRAMMAR.md (and vice versa).
        entry: uv run python scripts/check_grammar_doc_sync.py   # see the note above
        language: system
        pass_filenames: false
        files: ^(config/grammar\.yaml|docs/GRAMMAR\.md)$
        always_run: false
