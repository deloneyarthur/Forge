# Forge main configuration (plan 2026-09 §12; Batch 5 G5, D422).
# Three things only: where Forge's DB lives, where Crucible's inbox is, and the weekly run's knobs.
# The schema (forge_config.py, extra="forbid") rejects anything else — the daemon-era keys
# (enumeration.*, submission.*, crucible.db_path) left with the daemon; a stale key fails loud.
forge:
  db_path: ~/forge_data/forge.db
  crucible:
    inbox_path: ~/optbt_data/inbox        # where the weekly run writes (contracts submit_candidate)
  # campaign: overrides for forge.campaign.types.CampaignConfig (every field has a default there;
  # unknown keys fail loud). Example:
  #   campaign:
  #     weekly_cap: 400
  #     exploration_min: 20
