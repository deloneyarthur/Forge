# Forge main configuration. See docs/DESIGN.md §10.1.
forge:
  data_root: ~/forge_data
  db_path: ~/forge_data/forge.db
  log_root: ~/forge_data/logs

  crucible:
    inbox_path: ~/optbt_data/inbox        # where Forge writes
    db_path: ~/optbt_data/runs.duckdb     # where Forge reads (read-only)
    contracts_version: "1.6"

  enumeration:
    max_candidates_per_batch: 5000   # v1 go-live; ramp once loop stability is proven
    seed: 42

  submission:
    batch_size: 200
    inflight_threshold: 0.80   # wait until 80% of prev batch is gated
    poll_interval_seconds: 60  # v1 go-live; Crucible runner polls every 30s
    stall_after_seconds: 10800 # Q38/D137 §7.3 stall guard: block if Crucible has
                               # held new work >=3h with zero decisions (0=off)

  feedback:
    light_consumption_after_every: 1   # every batch
    full_analysis_after_every: 10      # every 10 batches
    deep_review_after_every: 50        # every 50 batches
