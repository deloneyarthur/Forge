# Pre-filter battery thresholds. See FORGE_DESIGN.md §10.2.
prefilter:
  signal_density:
    min_activations: 30
  expected_trade_count:
    min_trades: 50
  predicted_activations:
    # T1.3 (PROMPT_5_FORGE_V1_1_REVISED): floor on the intersection of
    # directional x regime activations. Catches silently-inert configs
    # (e.g., days_to_earnings regime gate on SPY where the ETF has no
    # earnings -> empty intersection) before submission.
    min_entries: 10
  novelty:
    max_jaccard_overlap: 0.80
  signal_correlation:
    # T2.6 (PROMPT_5_FORGE_V1_1_REVISED): max pairwise Jaccard overlap
    # between any two signals' activation_dates in a single config.
    # Catches empirically-redundant signal pairs that pass C1's
    # structural family-disjointness check.
    max_jaccard_overlap: 0.85
  regime_exposure:
    max_single_regime_concentration: 0.80
  permutation_test:
    n_permutations: 100
    # Operator-approved proposal 646a865f-1379-4535-b470-e1df4b91d0f2 (2026-05-14)
    # was applied as a 0.10→0.50 loosen to bootstrap survival under synthetic
    # cache. Reverted after Crucible's real feature cache shipped (commit
    # b447597) + Forge's indicator-aware threshold sampling fixed the actual
    # bottleneck. Threshold back to 0.10. The audit row in grammar_proposals
    # remains.
    p_value_threshold: 0.10
    # D075 (2026-05-19): compare returns at T+forward_horizon_days instead of
    # T+0. Trend / leading-indicator signals don't correlate with same-day
    # returns but DO correlate with k-day-forward returns (one trading week
    # typical for swing strategies). 0 preserves legacy same-day behavior.
    forward_horizon_days: 5
  auto_tune:
    enabled: true
    min_promotion_rate: 0.005          # 0.5%
    max_promotion_rate: 0.05           # 5%
    adjustment_pct_per_step: 0.10
    max_cumulative_adjustment: 0.30
