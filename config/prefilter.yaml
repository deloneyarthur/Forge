# Pre-filter battery thresholds. See FORGE_DESIGN.md §10.2.
prefilter:
  signal_density:
    min_activations: 30
  expected_trade_count:
    min_trades: 50
    # D076 / Q16 — empirical-prior knobs. Reject configs whose
    # (hypothesis, dte_bucket, directional_family) bucket has seen
    # >= min_bucket_samples gated runs AND posterior P(n_trades >=
    # min_trades) < min_pass_probability. Buckets under the sample
    # floor fall back to the legacy activations heuristic so unseen
    # buckets keep exploring. Defaults match Q16 analysis: 20-sample
    # floor matches the smallest bucket size where Q17's diagnostic
    # noticed >90% zero-trade rates; 0.10 threshold rejects buckets
    # whose smoothed pass-rate is below ~10%.
    min_pass_probability: 0.10
    min_bucket_samples: 20
  predicted_activations:
    # T1.3 (PROMPT_5_FORGE_V1_1_REVISED): floor on the intersection of
    # directional x regime activations. Catches silently-inert configs
    # (e.g., days_to_earnings regime gate on SPY where the ETF has no
    # earnings -> empty intersection) before submission.
    min_entries: 10
  novelty:
    max_jaccard_overlap: 0.80
  signal_correlation:
    # T2.6 (PROMPT_5_FORGE_V1_1_REVISED): max pairwise Jaccard overlap
    # between any two signals' activation_dates in a single config.
    # Catches empirically-redundant signal pairs that pass C1's
    # structural family-disjointness check.
    max_jaccard_overlap: 0.85
    # D227/D239 FLIPPED 2026-07-04 (prereg 5082d332, after D220 confirmed): exclude the
    # regime_filter CONTEXT GATE from the pairwise overlap. Measured: 94% of vol_event kills
    # were the gate co-firing with the alpha signals it gates (median Jaccard 0.949) —
    # structural, not the content redundancy this filter targets. Compares only alpha-bearing
    # signals now; content redundancy still rejects.
    exclude_regime_filter: true
  regime_exposure:
    max_single_regime_concentration: 0.80
  permutation_test:
    n_permutations: 100
    # Operator-approved proposal 646a865f-1379-4535-b470-e1df4b91d0f2 (2026-05-14)
    # was applied as a 0.10→0.50 loosen to bootstrap survival under synthetic
    # cache. Reverted after Crucible's real feature cache shipped (commit
    # b447597) + Forge's indicator-aware threshold sampling fixed the actual
    # bottleneck. Threshold back to 0.10. The audit row in grammar_proposals
    # remains.
    p_value_threshold: 0.10
    # D075 (2026-05-19): compare returns at T+forward_horizon_days instead of
    # T+0. Trend / leading-indicator signals don't correlate with same-day
    # returns but DO correlate with k-day-forward returns (one trading week
    # typical for swing strategies). 0 preserves legacy same-day behavior.
    forward_horizon_days: 5
    # D224/D226 FLIPPED 2026-07-04 (prereg 848a1f671392, after D220 confirmed): the
    # forward return is the CUMULATIVE T+1..T+k TRADING-day return (was the single
    # calendar day at T+k — two bugs: point-in-time not cumulative, and calendar-day
    # shift dropped ~40% of Mon/Tue samples to weekends). Shadow-count D226 validated:
    # trend/event_momentum/ve survival up. Resolve the prereg on the POST-FLIP cohort.
    forward_return_mode: cumulative_trading
  auto_tune:
    # The §5.5 auto-tune TRIGGER was disarmed (D218/D298) then deleted (D325); its
    # enabled/min_promotion_rate/max_promotion_rate/max_cumulative_adjustment fields
    # were removed from the schema (D326). The one surviving key is the step size for
    # the manual `grammar apply-proposal` prefilter-tighten path.
    adjustment_pct_per_step: 0.10
