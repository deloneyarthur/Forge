#   H2 (new directional thesis) — `event_momentum` (PEAD): directional = `sue`
#   (post_event_drift surprise -> drift), regime/timing gate = `days_since_earnings`
#   (calendar, "fire within N td AFTER the print" -> sidesteps the IV crush the
