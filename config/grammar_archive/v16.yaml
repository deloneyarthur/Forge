# Forge v4 grammar — 21 operator-owned rules (DESIGN.md §3.5).
#
# This file is operator-owned (CLAUDE.md hard rule #1). Changes to
# `rules:` must come with a `grammar_version` bump and an archive entry
# under `config/grammar_archive/`; the pre-commit hook enforces this and
# `forge.grammar.loader.load_grammar` rejects silent edits at load time.
#
# Predicate encodings per the pre-code confirmation (2026-05-13) and the
# operator-approved adjustments in IMPLEMENTATION_DECISIONS.md D009-D018.
#
# v2 (2026-05-17, D039 / T1.4): R3 expanded to support 5 event-proximity
# indicators (added days_to_cpi, days_to_nfp, days_to_opex from Crucible
# Prompt 6) AND to reject ETF underlyings using `days_to_earnings`
# (sentinel-value silent-failure case from the translation corpus).
#
# v3 (2026-05-19, D071-final): §3.5 S5 rewritten as required_always +
# required_from_set + optional_additions per hypothesis. The textual
# `rules:` content here is unchanged from v2 — the S5 schema lives in
# `forge.grammar.custom_predicates._S5_HYPOTHESIS_EXITS` (python-side)
# and is invoked via the existing `exits_match_hypothesis` predicate.
# Concrete additions: chandelier_exit / parabolic_sar_exit on
# trend_continuation; target_exit / zscore_reversion_exit on
# mean_reversion + relative_value; iv_crush_exit as optional on
# mean_reversion. Crucible contracts bumped 1.10.0 → 1.11.0
# (KNOWN_EXIT_IDS adds the 4 new IDs). See IMPLEMENTATION_DECISIONS.md
# D071 + D071-final + PHASE_4_MULTI_EXIT_DRAFT.md.
#
# v4 (2026-05-27, D077): R2 expanded — trend_continuation regime gate
# accepts rv_rank (realized-vol percentile rank, volatility family) in
# addition to adx/hurst. PTS thesis: "enter trend-following long calls
# when realized vol is cheap." Python-side constant renamed from
# _R2_TREND_STRENGTH_INDICATORS to _R2_TREND_CONTINUATION_REGIME_INDICATORS.
#
# v5 (2026-05-31, D098): NO change to the `rules:` text below — this is the
# first version bump that is purely an enumeration-policy + pre-filter change,
# not a rule edit. It exists so Crucible can attribute the post-cleanup shift
# to exactly this change via `crucible funnel --compare v4 v5`. Two changes,
# both Forge runtime policy (the 21 operator-owned rules are untouched, hard
# rule #1):
#   1. `regime_arbitrage` dropped from enumeration — low-yield by construction
#      (its mandatory regime_filter stacks contradictory regime concepts that
#      rarely co-align: 81% zero-trade, no edge thesis). Like tail_hedge/D066
#      it stays a valid hand-authored hypothesis (S1 still lists all 6) but
#      Forge never enumerates it. See `DISABLED_HYPOTHESES` in
#      forge.enumeration.search_space.
#   2. `relative_value` gets its first FAIR test: underlying reverts to null
#      (pairs strategy; Crucible 4f5271f loads all 37 pair legs regardless of
#      tier, retiring D079's single-ticker anchor) AND its poisoned pre-v5
#      gated cohort (the now-fixed pairs-loading defect) is cold-started out of
#      the `expected_trades` prior so v5 configs are no longer killed at
#      pre-filter on stale zero-trade history. See `COLD_START_HYPOTHESES` in
#      forge.feedback.trade_rate_priors. See IMPLEMENTATION_DECISIONS.md D098.
#
# v6 (2026-06-02, D099): NO change to the `rules:` text below — like v5 this is
# an enumeration-layer change, not a rule edit (hard rule #1: the 21 rules are
# untouched). The sampler now emits PERCENTILE thresholds (a [0,1] percentile of
# the indicator's own trailing distribution + use_percentile) instead of
# absolute values, for the firing-starved binding-constraint indicators only:
# the mean_reversion-family directional oscillators (rsi_2 / rsi_14 / ...) and
# the trend_continuation adx / hurst regime gate. Already-rank (iv_rank /
# rv_rank), dealer_positioning directional, and the whole volatility_event
# archetype stay absolute. Coordinated Crucible-first change (Crucible 494cf96
# strategy path + the feature-cache-writer fix); A/B via
# `crucible funnel --compare v5 v6`. See forge.enumeration.indicator_thresholds
# and IMPLEMENTATION_DECISIONS.md D099.
#
# v7 (2026-06-03, D100): NO `rules:` text change — enumeration-layer + feedback,
# not a rule edit (hard rule #1; the 21 rules are untouched). Two changes,
# orthogonal by hypothesis: (1) trend_continuation's `hurst` regime gate flips to
# op ">" (allow when TRENDING / high-hurst; was "<" = mean-reverting, backwards —
# Q26); (2) mean_reversion joins COLD_START_HYPOTHESES so v6's percentile firing
# fix isn't blocked by its poisoned pre-v6 expected_trades prior (first v6 batch
# killed 100% of mean_reversion at expected_trades despite passing signal_density).
# A/B via `crucible funnel --compare v6 v7`. See IMPLEMENTATION_DECISIONS.md D100.
#
# v8 (2026-06-04, D102): NO `rules:` text change — enumeration-layer change, not
# a rule edit (hard rule #1; the 21 rules are untouched). Horizon-matched DTE.
# The §3.5 S4 "DTE matches the signal's lookback" rule now reads each indicator's
# *signal horizon* from a Forge-owned table (forge.grammar.signal_horizon),
# NOT `IndicatorMetadata.lookback` — the live registry reports lookback=0 for
# 34/43 indicators (and wrong values for the rest: rsi_2->14, adx/hurst/macd->0),
# which had collapsed S4 to "almost everything -> swing_short" and produced
# horizon-MISMATCHED configs. The sampler now DERIVES the DTE bucket from the
# directional signal's horizon at generation (DTE_target = k*horizon for
# mean_reversion/trend_continuation, an event-bracket for volatility_event,
# snapped to the nearest S4-permitted bucket; relative_value stays uniform — its
# real DTE is a Crucible runtime choice off the live spread half-life), and the
# regime gate no longer constrains the bucket (S4 was always about the directional
# signal, matching the validator). `k` in {2,3,4} is the new sampled knob,
# replacing blind DTE sampling. Per the Crucible horizon-matched-DTE handoff
# (2026-06-04). A/B via `crucible funnel --compare v7 v8`. See
# IMPLEMENTATION_DECISIONS.md D102.
#
# v9 (2026-06-05, D103): NO `rules:` text change — enumeration-policy + feedback,
# not a rule edit (hard rule #1; the 21 rules are untouched). relative_value
# quality-bias. By v8 relative_value FIRING is solved (~77% fire on current
# grammar vs 99% zero-trade on the pre-v5 pairs-loading-bug cohort), but the gap
# shifted to per-component Sharpe (median traded ~-0.085; rejects fail
# walk_forward_sharpe_median / cpcv_sharpe_p25). Three changes bias generation
# toward the gate-rewarded region: (1) the pairs_convergence template params
# tighten — pvalue_max 0.10-0.25 -> 0.02-0.12 (stronger cointegration),
# zscore_entry 0.5-1.5 -> 1.0-2.0 (larger divergence entry); (2) a dynamic,
# Sharpe-aware feedback weight over relative_value's regime-gate indicator
# (forge.feedback.rejection_weights), so the sampler learns toward regimes that
# yield gate-passing components (the regime POOL is unchanged — no static
# curation); (3) a per-hypothesis submission-diversity floor in the diversifier
# so the orthogonal sleeve can't be starved by a feedback oscillation. Only the
# pairs template-param tightening (1) is grammar-versioned; (2)/(3) are feedback
# + ranking (versionless, like D101) but ship together. A/B via
# `crucible funnel --compare v8 v9`. See IMPLEMENTATION_DECISIONS.md D103.
#
# v10 (2026-06-07, D105): NO change to the `rules:` text below — enumeration-
# policy bump per the v5-v9 precedent (hard rule #1: the 21 rules untouched).
# Pairs `lookback` drops the 378 option → (126, 189, 252): Crucible's yield map
# showed the lookback > 280 band, properly running and trading post-rv-fix
# (Crucible 5fd485a), is 0-for-155 decided with best WF 0.19, while all 7
# relative_value components sit at lookback <= 252 — one choice of four ≈ 25%
# of rv enumeration provably wasted (`sampler._sample_pairs_template_params`).
# Tightening per hard rule #4. Ships alongside D105's versionless feedback
# re-aim (component-rate reward + hypothesis×dte_bucket + underlying-class
# weights) — only the lookback cap is grammar-gated, so `crucible funnel
# --compare v9 v10` cleanly attributes the rv-quality arm; the allocation
# shifts show in the submission mix instead. See IMPLEMENTATION_DECISIONS.md
# D105 + the 2026-06-07 Crucible handoff (FORGE_feedback_reward_yield_map.md).
#
# v11 (2026-06-07, D107): NO change to the `rules:` text below — like v4/D077
# this is a python-side predicate-constant expansion that the rule references by
# function name (hard rule #1: the 21 operator-owned rules are untouched). H3 —
# the dealer-gamma regime switch, BOTH sides (the complete switch): R2's
# `_R2_TREND_CONTINUATION_REGIME_INDICATORS` adds `gamma_flip_distance_pct` so
# trend_continuation gates on the SHORT-gamma / vol-amplifying regime (flip above
# spot -> dealers short gamma; op_regime ">" is the table default, no sampler
# change), AND R1 (`mean_reversion_requires_iv_rank_gate`) accepts
# `gamma_flip_distance_pct` as an alternative to iv_rank so mean_reversion gates
# on the LONG-gamma / dampening / ranging regime (flip below spot; op "<" set in
# `_regime_signal_params`). Same gate, opposite side per hypothesis. Thesis
# (web- + data-grounded): trend/mean-rev pay in opposite dealer-gamma regimes;
# trend (0.62%) and mean_reversion (0.86%) are weak archetypes on the 2026-06-08
# gated cohort, so gating each to its productive regime is the lever. LOOSENING
# (more regime gates accepted) but operator-DIRECTED (not an auto-refiner
# proposal): hard rule #4 binds the refiner; a supervised edit takes the
# hard-rule-#10 path (version bump + archive + Decision Log D107 records the
# 2026-06-07 approval). Both gamma sides ship in v11 (MR folded same session,
# before any v11 cohort accrued — the §7.3 rate limiter held ALL v11 submissions,
# so no contamination). A/B via `crucible funnel --compare v10 v11` (one coherent
# hypothesis; the by-feature join separates trend×gamma from mr×gamma). The
# orthogonal-yield feedback (H4) ships next (versionless); H1/H2 (cross-sectional
# rank, event-momentum) are contracts-gated — see NEW_HYPOTHESES_V11_PLAN.md +
# PROMPT_CRUCIBLE_NEW_HYPOTHESES_V11.md.
#
# v12 (2026-06-08, D109): NO change to the `rules:` text below — like v5-v11 this
# is an enumeration-policy bump, not a rule edit (hard rule #1; the 21
# operator-owned rules are untouched). S1 is a `cardinality` rule (hypothesis
# count == 1); the ALLOWED hypothesis values live in the contracts
# `StrategyConfig.hypothesis` Literal (1.16.0 adds `event_momentum`), and the
# combiner type lives in `CombinerSpec` — neither is enumerated in the rules
# text, so both additions are pure Python-side enumeration policy. H1 + H2 ship
# bundled now that both Crucible dependencies have landed (contracts 1.16.0; the
# composable rank runner; the days_since_earnings -> calendar reclassification
# that lets sue + days_since_earnings coexist under C1; event_momentum dispatch):
#   H1 (breadth lever) — `cross_sectional_rank` is a new permitted combiner.type
#   for the breadth-starved DIRECTIONAL archetypes (trend_continuation,
#   mean_reversion, event_momentum; see RANK_COMBINER_HYPOTHESES). It replaces
#   per-name boolean firing with score->rank->trade-top-rank_k->rebalance, so the
#   trade count is DETERMINISTIC (~rank_k * rebalances >> the 100-trade floor that
#   kills ~98% of single-name directional candidates). `expected_trades` estimates
#   it structurally instead of on the stale single-name prior. Emission is ON by
#   default at a ~1/3 exploration share (the point of v12); --no-cross-sectional-rank
#   is an operational kill switch (configs revert to confluence; byte-identical, hard
#   rule #6 — the sampler-core no-share path is unchanged). Routes to Crucible's
#   composable rank runner by combiner.type on the forge_-prefixed name.
#   H2 (new directional thesis) — `event_momentum` (PEAD): directional = `sue`
#   (post_event_drift surprise -> drift), regime/timing gate = `days_since_earnings`
#   (calendar, "fire within N td AFTER the print" -> sidesteps the IV crush the
#   vol_event sleeves ride -> structurally orthogonal). Single-name (ETF-excluded;
#   no earnings), horizon-matched DTE (k * the ~10 td drift window -> swing_short/
#   mid), drift-decay time_stop + optional momentum trailing, no hard_profit_target
#   (convex, like the winners). Its productive form is cross-sectional (§2.4) -> it
#   is also rank-eligible. Always enumerable in v12 (not flag-gated).
# Both arms self-identify in config_json (combiner.type / hypothesis), so the
# by-feature decision-rate join attributes each even when bundled; `crucible funnel
# --compare v11 v12` is the headline A/B. See IMPLEMENTATION_DECISIONS.md D109 +
# H1_H2_V12_IMPLEMENTATION_SPEC.md.
#
# v13 (2026-06-09, D112): NO change to the `rules:` text below — enumeration-
# policy tightening (hard rule #1; the 21 operator-owned rules untouched).
# Dealer_positioning indicators become SINGLE-NAME ONLY: a config that draws any
# dealer signal never takes the H1 cross_sectional_rank branch (sampler skip,
# no rng consumed), and relative_value's universe-template regime pool excludes
# the dealer family. Origin: Crucible handoff 2026-06-09 (the dealer headline x
# universe is the ~100x serial-runner cost tail, 5-14 min vs 1-3 s) + Forge's
# own decomposition of the decided cohort (the 199 legacy universe x dealer runs:
# 0 §8.7-gate clears, mean WF -0.129; the single-name dealer cohort holds the
# only CPCV-p25 clears in the pool). Single-name dealer sampling weight is
# UNTOUCHED — and rises organically, since dealer draws now always stay
# single-name. See IMPLEMENTATION_DECISIONS.md D112 +
# PROMPT_CRUCIBLE_DEALER_SINGLE_NAME_RESTRICTION.md.
#
# v14 (2026-06-09, D116): NO change to the `rules:` text below — enumeration-
# policy tightening widening D112's dealer cut to the CHAIN-READING class
# (iv_rank, put_call_flow; `CHAIN_READING_INDICATOR_IDS` in search_space.py).
# Crucible's fail-open sweep (Q33; probe_results/rank_gate_failopen_sweep.json)
# proved every chain-reading indicator evaluated per-name on the rank/pairs
# paths reads the REFERENCE chain (params["underlying"] defaults to "SPY",
# decoupled from the ranked sym): iv_rank fires on noise (SPY's chain IV at the
# name's spot), put_call_flow is a hidden uniform SPY gate, dealer greeks were
# already inert (D115). Same two enforcement points as v13: the sampler
# rank-branch skip (no rng consumed) and relative_value's regime-pool
# exclusion. Consequence under §3.5 R1 (MR's regime pool is exactly {iv_rank,
# gamma_flip_distance_pct}, both single-name-only): MEAN_REVERSION STRUCTURALLY
# NEVER RANKS as of v14 — 63% of v13 rank emission (17.2% of total) was
# noise-gated MR rank. Trend/em rank (bar-only / calendar gates) keep the
# breadth lever. Single-name pools UNTOUCHED (iv_rank stays R1's MR gate —
# coherent where the chain is pinned to the traded name). Re-admission trigger
# = Crucible's reference-underlying gate (AGREED-DEFERRED their side), not
# capacity. See IMPLEMENTATION_DECISIONS.md D116, OPEN_QUESTIONS.md Q33, +
# PROMPT_CRUCIBLE_RANK_GATE_CLASS_MAP.md.
#
# v15 (2026-06-09, D118): NO change to the `rules:` text below — enumeration-
# policy tightening re-keying D116's interim chain-reading set on Crucible's
# full indicator→mode map (probe_results/rank_gate_class_map.json, 45
# indicators, completeness-asserted their side; their response to
# PROMPT_CRUCIBLE_RANK_GATE_CLASS_MAP.md). The broken class is per-name
# DECOUPLING (the indicator's data source comes from its own params, which the
# rank/pairs paths never thread per-name), not chain reads. Adds the per-name
# event/DB ids: sue / days_since_earnings / days_to_earnings (params["symbol"]-
# keyed → inert fail-open; sue as a rank directional would rank the universe
# on NaN — the dealer-directional 0/8 pattern) any-role, and
# expected_value_estimator (runs-DB, params["underlying"]-keyed → the
# reference's EV for every name) as GATE/DIRECTIONAL only — the §3.5 X2
# fractional_kelly sizer chain is reference-keyed on every path including
# single-name and stays rank-eligible (`SINGLE_NAME_ONLY_INDICATOR_IDS` +
# `RANK_DECOUPLED_GATE_INDICATOR_IDS` in search_space.py). Same two
# enforcement points as v13/v14. Consequence: EVENT_MOMENTUM STRUCTURALLY
# NEVER RANKS as of v15 (H2's whole signal set is per-name-event-keyed) —
# joins MR; trend_continuation (bar-only gates) keeps the breadth lever.
# The gap was fully latent: zero rank submissions ever carried these ids as
# gate/directional (the SPY signal_density fallback killed em rank draws by
# accident — v15 makes it structural). Single-name pools UNTOUCHED (em keeps
# sue+dse at full weight — coherent where the symbol is pinned; Q31 unblocked
# em data 2026-06-09 17:18:21 PDT). market_wide_by_design ids (vix_level,
# days_to_cpi/fomc/nfp/opex) deliberately stay eligible — uniform-across-
# names is correct for a market gate. Re-admission trigger = Crucible threads
# per-name symbols on the rank path (their map's rank_per_name_coherent key),
# not capacity. See IMPLEMENTATION_DECISIONS.md D118 + OPEN_QUESTIONS.md Q33.
#
# v16 (2026-06-10, D125): NO change to the `rules:` text below — two
# python-side policy changes, one boundary. (1) The rank/universe exclusion
# is keyed on the contracts-1.18.0 registry flags (rank_per_name_coherent /
# market_wide_by_design, fail-closed — registry snapshot d701f07d4f23bd1f):
# `rank_excluded_indicator_ids` in search_space.py retires the v13-v15
# explicit id sets; new indicators auto-inherit exclusion; the v15
# confluence exemption is dropped (D122: EV-as-sizing has no live wiring —
# the X2 kelly chain pins its config single-name, so fractional_kelly never
# ranks); pairs_zscore joins the universe GATE exclusion (stays rv's
# pairs-path directional); dealer family excluded independently of flags
# (D115 re-admission needs evidence, not just a flag flip). (2) FIRST
# LOOSENING BUMP: P3 gains hypothesis-scoped delta-band overrides
# (python-side table, like v3's S5 schema) — trend_continuation swing_long
# 0.20-0.55 and swing_mid 0.30-0.55 (upper edges to the 0.55 cap; all other
# hypotheses on base bands). Operator-approved via OPEN_PROPOSALS 343e71fd;
# evidence = verdicts delta-tercile readout (trend components 5/8/16 rising
# to the upper edge — P3's relax clause fired) + Frazzini-Pedersen RAPS 2022
# (Q35). MR/vol_event gradients inverted — deliberately not widened. See
# IMPLEMENTATION_DECISIONS.md D125.

grammar_version: v16

rules:
  # =========================================================================
  # Structural rules (S1-S5) — what shape a strategy must have
  # =========================================================================

  - id: S1
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S1
    predicate:
      type: cardinality
      field: hypothesis
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "3+ promoted strategies have explicit multi-hypothesis structure"
      - "domain expert provides theoretical basis for relaxation"

  - id: S2
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S2
    predicate:
      type: cardinality
      field: signals.role.directional
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategies systematically use two competing directional signals"

  - id: S3
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S3
    predicate:
      type: cardinality
      field: signals.role.regime_filter
      min: 1
    cost_estimate: low
    evidence_to_relax:
      - "unfiltered strategies promote at parity with regime-filtered ones over 4+ batches"

  - id: S4
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S4
    predicate:
      type: custom_python
      function: lookback_class_matches_dte_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "promoted long-lookback signals operating at short DTE buckets (or vice versa)"

  - id: S5
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S5
    predicate:
      type: custom_python
      function: exits_match_hypothesis
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategy uses an exit pattern §3.5 S5 forbids for its hypothesis"

  # =========================================================================
  # Composition rules (C1-C4) — which signal combinations are allowed
  # =========================================================================

  - id: C1
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C1
    predicate:
      type: custom_python
      function: no_duplicate_indicator_families
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategies use two same-family indicators with different parameters meaningfully"

  - id: C2
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C2
    predicate:
      type: custom_python
      function: directional_family_matches_hypothesis
    cost_estimate: high
    evidence_to_relax:
      - "promoted strategy combines hypothesis X with directional family Y where §3.5 C2 disallows the pairing"

  - id: C3
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C3
    predicate:
      type: cardinality
      field: signals
      max: 4
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 5+ signals with each contributing measurable orthogonal signal"

  - id: C4
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C4
    predicate:
      type: custom_python
      function: regime_indicators_disjoint_from_directional
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy reuses the directional indicator as a regime gate with different threshold"

  # =========================================================================
  # Parameter coherence rules (P1-P4)
  # =========================================================================

  - id: P1
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P1
    predicate:
      type: custom_python
      function: indicator_params_within_registry_ranges
    cost_estimate: low
    evidence_to_relax:
      - "registry param_ranges become too narrow vs. observed promoted-strategy parameter mass"

  - id: P2
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P2
    predicate:
      type: custom_python
      function: dte_window_matches_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "DTE window for a bucket needs widening based on observed promotion at the edges"

  - id: P3
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P3
    predicate:
      type: custom_python
      function: delta_target_in_dte_band
    cost_estimate: medium
    evidence_to_relax:
      - "delta band for a bucket needs widening based on observed promotion at the edges"

  - id: P4
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P4
    predicate:
      type: numerical_range
      field: sizer.per_trade_risk_pct
      min: 0.005
      max: 0.02
    cost_estimate: low
    evidence_to_relax:
      - "lower bound 0.5% blocks valid micro-sized hedges (cannot raise upper bound — contracts cap)"

  # =========================================================================
  # Exit logic rules (E1-E3)
  # =========================================================================

  - id: E1
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E1
    predicate:
      type: custom_python
      function: mandatory_exits_present
    cost_estimate: low
    evidence_to_relax:
      - "(cannot relax — contracts MANDATORY_EXIT_IDS enforces this; rule is defense in depth)"

  - id: E2
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E2
    predicate:
      type: custom_python
      function: at_most_two_stop_loss_exits
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 3 distinct stop-loss exits with non-redundant trigger conditions"

  - id: E3
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E3
    predicate:
      type: custom_python
      function: trailing_atr_has_activation_threshold
    cost_estimate: low
    evidence_to_relax:
      - "promoted trend strategy uses trailing_atr with activate_after_gain_pct < 0.30 systematically"

  # =========================================================================
  # Regime coherence rules (R1-R3)
  # =========================================================================

  - id: R1
    category: regime
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#R1
    predicate:
      type: custom_python
      function: mean_reversion_requires_iv_rank_gate
    cost_estimate: medium
    evidence_to_relax:
      - "promoted mean_reversion strategies use a non-iv_rank regime gate (e.g., percentile_rank)"

  - id: R2
    category: regime
    version: 2
    active: true
    rationale_ref: GRAMMAR.md#R2
    predicate:
      type: custom_python
      function: trend_requires_trend_strength_gate
    cost_estimate: medium
    evidence_to_relax:
      - "promoted trend strategies use a regime gate outside {adx, hurst, rv_rank}"

  - id: R3
    category: regime
    version: 2
