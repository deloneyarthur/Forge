# Forge v4 grammar — 21 operator-owned rules (DESIGN.md §3.5).
#
# This file is operator-owned (CLAUDE.md hard rule #1). Changes to
# `rules:` must come with a `grammar_version` bump and an archive entry
# under `config/grammar_archive/`; the pre-commit hook enforces this and
# `forge.grammar.loader.load_grammar` rejects silent edits at load time.
#
# Predicate encodings per the pre-code confirmation (2026-05-13) and the
# operator-approved adjustments in IMPLEMENTATION_DECISIONS.md D009-D018.
#
# v2 (2026-05-17, D039 / T1.4): R3 expanded to support 5 event-proximity
# indicators (added days_to_cpi, days_to_nfp, days_to_opex from Crucible
# Prompt 6) AND to reject ETF underlyings using `days_to_earnings`
# (sentinel-value silent-failure case from the translation corpus).
#
# v3 (2026-05-19, D071-final): §3.5 S5 rewritten as required_always +
# required_from_set + optional_additions per hypothesis. The textual
# `rules:` content here is unchanged from v2 — the S5 schema lives in
# `forge.grammar.custom_predicates._S5_HYPOTHESIS_EXITS` (python-side)
# and is invoked via the existing `exits_match_hypothesis` predicate.
# Concrete additions: chandelier_exit / parabolic_sar_exit on
# trend_continuation; target_exit / zscore_reversion_exit on
# mean_reversion + relative_value; iv_crush_exit as optional on
# mean_reversion. Crucible contracts bumped 1.10.0 → 1.11.0
# (KNOWN_EXIT_IDS adds the 4 new IDs). See IMPLEMENTATION_DECISIONS.md
# D071 + D071-final + PHASE_4_MULTI_EXIT_DRAFT.md.
#
# v4 (2026-05-27, D077): R2 expanded — trend_continuation regime gate
# accepts rv_rank (realized-vol percentile rank, volatility family) in
# addition to adx/hurst. PTS thesis: "enter trend-following long calls
# when realized vol is cheap." Python-side constant renamed from
# _R2_TREND_STRENGTH_INDICATORS to _R2_TREND_CONTINUATION_REGIME_INDICATORS.
#
# v5 (2026-05-31, D098): NO change to the `rules:` text below — this is the
# first version bump that is purely an enumeration-policy + pre-filter change,
# not a rule edit. It exists so Crucible can attribute the post-cleanup shift
# to exactly this change via `crucible funnel --compare v4 v5`. Two changes,
# both Forge runtime policy (the 21 operator-owned rules are untouched, hard
# rule #1):
#   1. `regime_arbitrage` dropped from enumeration — low-yield by construction
#      (its mandatory regime_filter stacks contradictory regime concepts that
#      rarely co-align: 81% zero-trade, no edge thesis). Like tail_hedge/D066
#      it stays a valid hand-authored hypothesis (S1 still lists all 6) but
#      Forge never enumerates it. See `DISABLED_HYPOTHESES` in
#      forge.enumeration.search_space.
#   2. `relative_value` gets its first FAIR test: underlying reverts to null
#      (pairs strategy; Crucible 4f5271f loads all 37 pair legs regardless of
#      tier, retiring D079's single-ticker anchor) AND its poisoned pre-v5
#      gated cohort (the now-fixed pairs-loading defect) is cold-started out of
#      the `expected_trades` prior so v5 configs are no longer killed at
#      pre-filter on stale zero-trade history. See `COLD_START_HYPOTHESES` in
#      forge.feedback.trade_rate_priors. See IMPLEMENTATION_DECISIONS.md D098.
#
# v6 (2026-06-02, D099): NO change to the `rules:` text below — like v5 this is
# an enumeration-layer change, not a rule edit (hard rule #1: the 21 rules are
# untouched). The sampler now emits PERCENTILE thresholds (a [0,1] percentile of
# the indicator's own trailing distribution + use_percentile) instead of
# absolute values, for the firing-starved binding-constraint indicators only:
# the mean_reversion-family directional oscillators (rsi_2 / rsi_14 / ...) and
# the trend_continuation adx / hurst regime gate. Already-rank (iv_rank /
# rv_rank), dealer_positioning directional, and the whole volatility_event
# archetype stay absolute. Coordinated Crucible-first change (Crucible 494cf96
# strategy path + the feature-cache-writer fix); A/B via
# `crucible funnel --compare v5 v6`. See forge.enumeration.indicator_thresholds
# and IMPLEMENTATION_DECISIONS.md D099.
#
# v7 (2026-06-03, D100): NO `rules:` text change — enumeration-layer + feedback,
# not a rule edit (hard rule #1; the 21 rules are untouched). Two changes,
# orthogonal by hypothesis: (1) trend_continuation's `hurst` regime gate flips to
# op ">" (allow when TRENDING / high-hurst; was "<" = mean-reverting, backwards —
# Q26); (2) mean_reversion joins COLD_START_HYPOTHESES so v6's percentile firing
# fix isn't blocked by its poisoned pre-v6 expected_trades prior (first v6 batch
# killed 100% of mean_reversion at expected_trades despite passing signal_density).
# A/B via `crucible funnel --compare v6 v7`. See IMPLEMENTATION_DECISIONS.md D100.
#
# v8 (2026-06-04, D102): NO `rules:` text change — enumeration-layer change, not
# a rule edit (hard rule #1; the 21 rules are untouched). Horizon-matched DTE.
# The §3.5 S4 "DTE matches the signal's lookback" rule now reads each indicator's
# *signal horizon* from a Forge-owned table (forge.grammar.signal_horizon),
# NOT `IndicatorMetadata.lookback` — the live registry reports lookback=0 for
# 34/43 indicators (and wrong values for the rest: rsi_2->14, adx/hurst/macd->0),
# which had collapsed S4 to "almost everything -> swing_short" and produced
# horizon-MISMATCHED configs. The sampler now DERIVES the DTE bucket from the
# directional signal's horizon at generation (DTE_target = k*horizon for
# mean_reversion/trend_continuation, an event-bracket for volatility_event,
# snapped to the nearest S4-permitted bucket; relative_value stays uniform — its
# real DTE is a Crucible runtime choice off the live spread half-life), and the
# regime gate no longer constrains the bucket (S4 was always about the directional
# signal, matching the validator). `k` in {2,3,4} is the new sampled knob,
# replacing blind DTE sampling. Per the Crucible horizon-matched-DTE handoff
# (2026-06-04). A/B via `crucible funnel --compare v7 v8`. See
# IMPLEMENTATION_DECISIONS.md D102.

grammar_version: v8

rules:
  # =========================================================================
  # Structural rules (S1-S5) — what shape a strategy must have
  # =========================================================================

  - id: S1
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S1
    predicate:
      type: cardinality
      field: hypothesis
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "3+ promoted strategies have explicit multi-hypothesis structure"
      - "domain expert provides theoretical basis for relaxation"

  - id: S2
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S2
    predicate:
      type: cardinality
      field: signals.role.directional
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategies systematically use two competing directional signals"

  - id: S3
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S3
    predicate:
      type: cardinality
      field: signals.role.regime_filter
      min: 1
    cost_estimate: low
    evidence_to_relax:
      - "unfiltered strategies promote at parity with regime-filtered ones over 4+ batches"

  - id: S4
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S4
    predicate:
      type: custom_python
      function: lookback_class_matches_dte_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "promoted long-lookback signals operating at short DTE buckets (or vice versa)"

  - id: S5
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S5
    predicate:
      type: custom_python
      function: exits_match_hypothesis
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategy uses an exit pattern §3.5 S5 forbids for its hypothesis"

  # =========================================================================
  # Composition rules (C1-C4) — which signal combinations are allowed
  # =========================================================================

  - id: C1
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C1
    predicate:
      type: custom_python
      function: no_duplicate_indicator_families
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategies use two same-family indicators with different parameters meaningfully"

  - id: C2
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C2
    predicate:
      type: custom_python
      function: directional_family_matches_hypothesis
    cost_estimate: high
    evidence_to_relax:
      - "promoted strategy combines hypothesis X with directional family Y where §3.5 C2 disallows the pairing"

  - id: C3
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C3
    predicate:
      type: cardinality
      field: signals
      max: 4
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 5+ signals with each contributing measurable orthogonal signal"

  - id: C4
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C4
    predicate:
      type: custom_python
      function: regime_indicators_disjoint_from_directional
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy reuses the directional indicator as a regime gate with different threshold"

  # =========================================================================
  # Parameter coherence rules (P1-P4)
  # =========================================================================

  - id: P1
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P1
    predicate:
      type: custom_python
      function: indicator_params_within_registry_ranges
    cost_estimate: low
    evidence_to_relax:
      - "registry param_ranges become too narrow vs. observed promoted-strategy parameter mass"

  - id: P2
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P2
    predicate:
      type: custom_python
      function: dte_window_matches_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "DTE window for a bucket needs widening based on observed promotion at the edges"

  - id: P3
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P3
    predicate:
      type: custom_python
      function: delta_target_in_dte_band
    cost_estimate: medium
    evidence_to_relax:
      - "delta band for a bucket needs widening based on observed promotion at the edges"

  - id: P4
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P4
    predicate:
      type: numerical_range
      field: sizer.per_trade_risk_pct
      min: 0.005
      max: 0.02
    cost_estimate: low
    evidence_to_relax:
      - "lower bound 0.5% blocks valid micro-sized hedges (cannot raise upper bound — contracts cap)"

  # =========================================================================
  # Exit logic rules (E1-E3)
  # =========================================================================

  - id: E1
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E1
    predicate:
      type: custom_python
      function: mandatory_exits_present
    cost_estimate: low
    evidence_to_relax:
      - "(cannot relax — contracts MANDATORY_EXIT_IDS enforces this; rule is defense in depth)"

  - id: E2
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E2
    predicate:
      type: custom_python
      function: at_most_two_stop_loss_exits
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 3 distinct stop-loss exits with non-redundant trigger conditions"

  - id: E3
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E3
    predicate:
      type: custom_python
      function: trailing_atr_has_activation_threshold
    cost_estimate: low
    evidence_to_relax:
      - "promoted trend strategy uses trailing_atr with activate_after_gain_pct < 0.30 systematically"

  # =========================================================================
  # Regime coherence rules (R1-R3)
  # =========================================================================

  - id: R1
    category: regime
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#R1
    predicate:
      type: custom_python
      function: mean_reversion_requires_iv_rank_gate
    cost_estimate: medium
    evidence_to_relax:
      - "promoted mean_reversion strategies use a non-iv_rank regime gate (e.g., percentile_rank)"

  - id: R2
    category: regime
    version: 2
    active: true
    rationale_ref: GRAMMAR.md#R2
    predicate:
      type: custom_python
      function: trend_requires_trend_strength_gate
    cost_estimate: medium
    evidence_to_relax:
      - "promoted trend strategies use a regime gate outside {adx, hurst, rv_rank}"

  - id: R3
    category: regime
    version: 2
    active: true
    rationale_ref: GRAMMAR.md#R3
    predicate:
      type: custom_python
      function: volatility_event_requires_event_proximity_gate
    cost_estimate: medium
    # v2 (T1.4 / grammar v2 / D039): R3 now accepts 5 event-proximity
    # indicators (days_to_earnings, days_to_fomc, days_to_cpi,
    # days_to_nfp, days_to_opex) AND rejects ETF underlyings paired
    # with days_to_earnings (sentinel-value silent-failure case).
    evidence_to_relax:
      - "promoted volatility_event strategies use a non-calendar event-proximity proxy"
      - "ETF earnings sentinel handling shipped on Crucible side (eliminates the 999 case)"

  # =========================================================================
  # Risk coherence rules (X1-X2)
  # =========================================================================

  - id: X1
    category: risk
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#X1
    predicate:
      type: custom_python
      function: vol_target_requires_realized_vol_indicator
    cost_estimate: medium
    evidence_to_relax:
      - "vol_target sizing can use an alternative realized-vol proxy registered in the indicator set"

  - id: X2
    category: risk
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#X2
    predicate:
      type: custom_python
      function: kelly_requires_expected_value_estimator
    cost_estimate: medium
    evidence_to_relax:
      - "alternative EV estimator becomes a Crucible helper (would also need expected_value_estimator alias)"
