# price-autocorrelation hurst, no reference chain (structurally unlike iv_rank/gamma_flip,
# the D116 incoherence). So the D150 `_RANK_INELIGIBLE_HYPOTHESES={mean_reversion}` hold is
# REMOVED: a hurst-gated mean_reversion config now RANKS (the breadth lever); the
# chain-reading iv_rank/gamma_flip gates stay single-name confluence via the published-flag
# skip (`space.rank_excluded_ids`). Honest cap (hard rule 6): breadth lifts the distribution
# CENTER, not the worst-quartile p25 — supply, not a promotion unlock. See
# IMPLEMENTATION_DECISIONS.md D151. (v20 cohort = 1400 single-name MR subs; clean boundary.)
#
# v22 (2026-06-15, D167+D169): NO change to the `rules:` text below — two enumeration-policy
# changes that ride one bump on DISJOINT hypothesis slices (cohort attribution → version bump).
#   (A) D167 — R1 widened: `rv_rank` (cheap REALIZED vol, op "<" = LOW/calm) joins iv_rank +
#       gamma_flip + hurst as an accepted mean_reversion regime gate. Crucible-validated
#       (FORGE_mr_rv_hurst_overlap_response): rv_rank is INDEPENDENT of (Spearman ≈ -0.036) and
#       DOMINATES the v21 hurst gate; rank-coherent (works on MR confluence AND rank). The
#       sampler `_MR_RANGING_GATES` biases the pick toward it vs the sparse iv_rank. ADD not
#       replace (R1 stays an OR; existing hurst configs untouched). custom_predicates R1 accept
#       + search_space MR pool + sampler bias. Honest cap (hard rule 6): center/quality, NOT a
#       p25 tail unlock. See IMPLEMENTATION_DECISIONS.md D167.
#   (B) D169 — sampler-only (`_exit_params`, no rule change): `event_passed_exit.n_bars_after_entry`
#       now samples the loosening ladder {3,5,8,13,21} (was inert → Crucible default 3) so a fresh
#       cohort fair-tests the D168 "loosen early time-exits" suspect on the vol_event slice.
#       event_passed alone (vol-scoped → mr slice stays clean); time_stop deferred. Caveated
#       suspect, NOT a promotion path. See IMPLEMENTATION_DECISIONS.md D169.
#
# v23 (2026-07-03, D236): NO change to the `rules:` text below — one
# enumeration-policy bump on the trend_continuation directional pool, from
# Crucible's cross-sectional signal-quality handoff (FORGE_signal_quality_
# champions_2026-07-03). Threshold + horizon tables only (grammar/signal_horizon
# + enumeration/indicator_thresholds); cohort attribution → version bump.
#   §2.1/§2.5 ADD sma_slope (SMA-200 slope, rank-IC 0.078 — the best trend
#     signal, dominates momentum_252) + ad_slope (volume champion) as
#     PERCENTILE-ONLY trend directionals (option_momentum/D138 pattern —
#     distribution-free, no Crucible data dependency). momentum_252 RETAINED
#     (the learned D106 weight ranks sma_slope against it; no hard swap).
#   §2.2 PRUNE returns_12m_skip1 from the directional pool (rank-corr 1.0 with
#     momentum_252 — stop double-sampling; eff-N / alpha-budget hygiene).
#   §2.3 PRUNE macd / ema_cross(12/26) / supertrend as trend directionals
#     (anti-momentum at 3-6m or redundant with sma_slope per the IC audit).
#   HONEST SCOPE (handoff §0): sharpens SELECTION quality (WF median +2.5%);
#     does NOT move the single-name CPCV-p25 promotion wall (flat-to--3.6%) —
#     hygiene, not a lever. See IMPLEMENTATION_DECISIONS.md D236.
#   NB: §0's -3.6% was RETRACTED by Crucible (2026-07-06) — a naive A/B; the fair
#     backtest has sma_slope WINNING CPCV-p25 +18% (D236 addendum). Still a stream-
#     quality lift, not a promotion unlock. The v23 trend slice ALSO gained the §2.7
#     chandelier-default exit + atr_multiplier sweep and the §2d days_to_fomc window
#     tighten (both Python-only; D236 addendum).
#
# v24 (2026-07-06, D254): FIRST rules-touching bump since v22 — the MR slice of the
# same handoff (§2b.1 + the R1 note). R1's accepted mean_reversion regime-gate set is
# WIDENED to admit `vol_regime` (the discrete vol tercile, gated <2 = exclude the
# high-vol tercile). Operator-approved loosening (hard rules #1 + #4), D107/D150/D167
# precedent. Crucible's cross-sectional MR backtest: vol_regime<2 beats the rv_rank
# cost gate by +0.244 CPCV-p25 in ALL 6 comps — the one place MR wants a REGIME gate
# over trend's rv_rank COST gate. hurst stays R1-accepted but the sampler biases AWAY
# (null-to-negative as an MR gate). zscore_returns KEPT (§2b.1 #2 by backtest; the
# single-name "drop" was an IC artifact). bb_pct ranker preference → learned D106 weight.
# Also folds the deferred D204 R2 evidence_to_relax fix (add gamma_flip + market_state
# to R2's documented accepted set). See IMPLEMENTATION_DECISIONS.md D254.
#
# v25 (2026-07-08, D257+D258): NO change to the `rules:` text below — two
# enumeration-policy changes. (1) D257: zscore_reversion_exit DROPPED from
# mean_reversion's S5 required_from_set — a pairs exit (reads
# ctx.pair_spread_zscore), structurally inert on single-name/xsect MR (Crucible
# FORGE_inert_pair_exits_2026-07-08); stays valid on relative_value. (2) D258:
# days_since_jump event-frequency VETO — an OPTIONAL SECOND regime gate
# (volatility family) that ANDs on top of trend_continuation's mandatory
# trend-strength gate (§3.5 S3 permits >1 regime gate; R2 satisfied by the
# primary gate). DORMANT until Crucible's registry serves the id (byte-identical
# cold path). See IMPLEMENTATION_DECISIONS.md D257 + D258.

grammar_version: v25

rules:
  # =========================================================================
  # Structural rules (S1-S5) — what shape a strategy must have
  # =========================================================================

  - id: S1
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S1
    predicate:
      type: cardinality
      field: hypothesis
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "3+ promoted strategies have explicit multi-hypothesis structure"
      - "domain expert provides theoretical basis for relaxation"

  - id: S2
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S2
    predicate:
      type: cardinality
      field: signals.role.directional
      count: 1
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategies systematically use two competing directional signals"

  - id: S3
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S3
    predicate:
      type: cardinality
      field: signals.role.regime_filter
      min: 1
    cost_estimate: low
    evidence_to_relax:
      - "unfiltered strategies promote at parity with regime-filtered ones over 4+ batches"

  - id: S4
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S4
    predicate:
      type: custom_python
      function: lookback_class_matches_dte_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "promoted long-lookback signals operating at short DTE buckets (or vice versa)"

  - id: S5
    category: structural
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#S5
    predicate:
      type: custom_python
      function: exits_match_hypothesis
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategy uses an exit pattern §3.5 S5 forbids for its hypothesis"

  # =========================================================================
  # Composition rules (C1-C4) — which signal combinations are allowed
  # =========================================================================

  - id: C1
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C1
    predicate:
      type: custom_python
      function: no_duplicate_indicator_families
    cost_estimate: medium
    evidence_to_relax:
      - "promoted strategies use two same-family indicators with different parameters meaningfully"

  - id: C2
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C2
    predicate:
      type: custom_python
      function: directional_family_matches_hypothesis
    cost_estimate: high
    evidence_to_relax:
      - "promoted strategy combines hypothesis X with directional family Y where §3.5 C2 disallows the pairing"

  - id: C3
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C3
    predicate:
      type: cardinality
      field: signals
      max: 4
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 5+ signals with each contributing measurable orthogonal signal"

  - id: C4
    category: composition
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#C4
    predicate:
      type: custom_python
      function: regime_indicators_disjoint_from_directional
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy reuses the directional indicator as a regime gate with different threshold"

  # =========================================================================
  # Parameter coherence rules (P1-P4)
  # =========================================================================

  - id: P1
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P1
    predicate:
      type: custom_python
      function: indicator_params_within_registry_ranges
    cost_estimate: low
    evidence_to_relax:
      - "registry param_ranges become too narrow vs. observed promoted-strategy parameter mass"

  - id: P2
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P2
    predicate:
      type: custom_python
      function: dte_window_matches_bucket
    cost_estimate: medium
    evidence_to_relax:
      - "DTE window for a bucket needs widening based on observed promotion at the edges"

  - id: P3
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P3
    predicate:
      type: custom_python
      function: delta_target_in_dte_band
    cost_estimate: medium
    evidence_to_relax:
      - "delta band for a bucket needs widening based on observed promotion at the edges"

  - id: P4
    category: parameter
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#P4
    predicate:
      type: numerical_range
      field: sizer.per_trade_risk_pct
      min: 0.005
      max: 0.02
    cost_estimate: low
    evidence_to_relax:
      - "lower bound 0.5% blocks valid micro-sized hedges (cannot raise upper bound — contracts cap)"

  # =========================================================================
  # Exit logic rules (E1-E3)
  # =========================================================================

  - id: E1
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E1
    predicate:
      type: custom_python
      function: mandatory_exits_present
    cost_estimate: low
    evidence_to_relax:
      - "(cannot relax — contracts MANDATORY_EXIT_IDS enforces this; rule is defense in depth)"

  - id: E2
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E2
    predicate:
      type: custom_python
      function: at_most_two_stop_loss_exits
    cost_estimate: low
    evidence_to_relax:
      - "promoted strategy uses 3 distinct stop-loss exits with non-redundant trigger conditions"

  - id: E3
    category: exit
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#E3
    predicate:
      type: custom_python
      function: trailing_atr_has_activation_threshold
    cost_estimate: low
    evidence_to_relax:
      - "promoted trend strategy uses trailing_atr with activate_after_gain_pct < 0.30 systematically"

  # =========================================================================
  # Regime coherence rules (R1-R3)
  # =========================================================================

  - id: R1
    category: regime
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#R1
    predicate:
      type: custom_python
      function: mean_reversion_requires_iv_rank_gate
    cost_estimate: medium
    # v22 (D167): accepted-gate set widened to {iv_rank, gamma_flip_distance_pct, hurst,
    # rv_rank} — rv_rank (cheap realized vol) added per Crucible's hurst-overlap validation
    # (independent of + dominates hurst). The `function:` is unchanged; the accepted set lives
    # in custom_predicates. ADD not replace (R1 stays an OR).
    # v24 (D254): accepted set widened to {..., vol_regime} — the discrete vol tercile (gated
    # <2 = exclude the high-vol tercile). Crucible's xsect-MR backtest (§2b.1): vol_regime<2
    # beats the rv_rank cost gate by +0.244 CPCV-p25 in ALL 6 comps — the one place MR wants a
    # REGIME gate over trend's rv_rank COST gate. Operator-approved loosening (hard rules #1+#4).
    # hurst stays in the OR but the sampler biases away (null-to-negative as an MR gate).
    evidence_to_relax:
      - "promoted mean_reversion strategies use a non-iv_rank regime gate (gamma_flip / hurst / rv_rank / vol_regime, or a new percentile_rank)"

  - id: R2
    category: regime
    version: 2
    active: true
    rationale_ref: GRAMMAR.md#R2
    predicate:
      type: custom_python
      function: trend_requires_trend_strength_gate
    cost_estimate: medium
    # D204 fix (folded into the v24/D254 bump): the accepted set also includes
    # gamma_flip_distance_pct (v11/D107) and market_state (v17/D131) — listed here so
    # evidence_to_relax reflects the real accepted pool, not just the original three.
    evidence_to_relax:
      - "promoted trend strategies use a regime gate outside {adx, hurst, rv_rank, gamma_flip_distance_pct, market_state}"

  - id: R3
    category: regime
    version: 2
    active: true
    rationale_ref: GRAMMAR.md#R3
    predicate:
      type: custom_python
      function: volatility_event_requires_event_proximity_gate
    cost_estimate: medium
    # v2 (T1.4 / grammar v2 / D039): R3 now accepts 5 event-proximity
    # indicators (days_to_earnings, days_to_fomc, days_to_cpi,
    # days_to_nfp, days_to_opex) AND rejects ETF underlyings paired
    # with days_to_earnings (sentinel-value silent-failure case).
    evidence_to_relax:
      - "promoted volatility_event strategies use a non-calendar event-proximity proxy"
      - "ETF earnings sentinel handling shipped on Crucible side (eliminates the 999 case)"

  # =========================================================================
  # Risk coherence rules (X1-X2)
  # =========================================================================

  - id: X1
    category: risk
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#X1
    predicate:
      type: custom_python
      function: vol_target_requires_realized_vol_indicator
    cost_estimate: medium
    evidence_to_relax:
      - "vol_target sizing can use an alternative realized-vol proxy registered in the indicator set"

  - id: X2
    category: risk
    version: 1
    active: true
    rationale_ref: GRAMMAR.md#X2
    predicate:
      type: custom_python
      function: kelly_requires_expected_value_estimator
    cost_estimate: medium
    evidence_to_relax:
      - "alternative EV estimator becomes a Crucible helper (would also need expected_value_estimator alias)"
